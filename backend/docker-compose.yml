name: tms-linen

services:
  mysql:
    image: mysql:8.4
    container_name: tms-linen-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root # pragma: allowlist secret
      MYSQL_DATABASE: tms_linen
      TZ: UTC
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql-data:
